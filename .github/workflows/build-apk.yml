name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build with Full Details
        run: |
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          
          # Hata mesajını kesmeden, tam detayıyla ve debug modunda çalıştırıyoruz
          ./gradlew assembleDebug --debug --stacktrace
