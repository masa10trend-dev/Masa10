name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dynamic Directory Build
        run: |
          echo "Mevcut dizin taranıyor..."
          ls -la
          
          # Proje yapılandırma dosyasını nerede olursa olsun otomatik bulur
          TARGET_FILE=$(find . -name "settings.gradle.kts" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "HATA: Proje dosyası hiçbir dizinde bulunamadı!"
            exit 1
          fi
          
          DIR=$(dirname "$TARGET_FILE")
          echo "Tespit edilen proje dizini: $DIR"
          cd "$DIR"
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
