name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Direct Build Fix
        run: |
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          # Mevcut bozuk gradlew dosyalarını ve wrapper ayarlarını temizle
          rm -rf gradle gradlew gradlew.bat
          
          # Gradle 8.2 kararlı sürümünü doğrudan indirip kuralım
          sdkman_auto_answer=true
          curl -s "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o gradle-8.2.zip
          unzip -q gradle-8.2.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH
          
          # Kotlin eklenti çakışmasını önleyen gradle.properties ayarı
          echo "kotlin.android.build-tools.use-gradle=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          
          # Kararlı gradle motoru ile derle
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
