name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Proje klasörünü otomatik bulup içine girer, wrapper kurar ve build alır
      - name: Find Project Directory and Build APK
        run: |
          # build.gradle.kts dosyasının olduğu klasörü buluyoruz
          BUILD_FILE=$(find . -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "HATA: Proje dosyası bulunamadı!"
            exit 1
          fi
          
          DIR=$(dirname "$BUILD_FILE")
          echo "Proje dizini bulundu: $DIR"
          cd "$DIR"
          
          # Eğer gradlew yoksa oluştur
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Üretilen APK'yı bulup kaydeder
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
