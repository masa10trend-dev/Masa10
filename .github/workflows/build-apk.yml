name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto Fix and Build
        run: |
          # 1. Zip dosyasını aç
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          # 2. Hata veren tüm gradle/kts dosyalarındaki kotlin eklenti satırlarını kökten temizleyelim
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i '/org.jetbrains.kotlin.android/d' {} +
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i '/kotlin("android")/d' {} +
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i '/id("com.android.application")/a \    kotlin("android") version "1.9.24" apply false' {} + || true
          
          # 3. Doğru dizine geçiş yap
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          # 4. Gradle Wrapper yoksa oluştur ve kararlı Gradle 8.5 sürümüne sabitle
          gradle wrapper --gradle-version 8.5
          
          chmod +x ./gradlew
          
          # 5. Derlemeyi başlat
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
