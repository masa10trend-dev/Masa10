name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Deponun kök dizinindeki her şeyi ve alt klasörleri listele
      - name: Debug - List all files in repository
        run: |
          echo "--- Kök Dizin Dosyaları ---"
          ls -la
          echo "--- Tüm Dosya ve Klasörler (Derinlemesine) ---"
          find . -maxdepth 3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Dummy
        run: echo "Dosya yapısını görmek için test adımı"
