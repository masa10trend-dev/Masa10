name: Masa10 APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Masa10 project
        run: |
          rm -rf masa10_v10_work
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip
          test -f masa10_v10_work/settings.gradle.kts
          test -f masa10_v10_work/app/google-services.json

      - name: Verify compile SDK
        run: |
          grep "compileSdk" masa10_v10_work/app/build.gradle.kts
          grep "targetSdk" masa10_v10_work/app/build.gradle.kts

      - name: Build debug APK
        working-directory: masa10_v10_work
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -f masa10_v10_work/app/build/outputs/apk/debug/app-debug.apk
          ls -lh masa10_v10_work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masa10-debug-apk
          path: masa10_v10_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
