name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare, Patch and Build APK
        run: |
          # 1. Zip dosyasını açıp proje dizinine gir
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          # 2. AGP ve Kotlin uyumsuzluk kısıtlamalarını esnet
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.suppressOutOfDateCompilerWarning=true
          EOF
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          
          # 3. Derlemeyi başlat, hata olursa sadece kritik 20 satırı ekrana bas
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || {
            echo "================ GERÇEK HATA NEDENİ ================"
            grep -E "e:|ERROR:|Caused by:|Plugin|FAILED|exception" build.log | tail -n 25
            echo "===================================================="
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
