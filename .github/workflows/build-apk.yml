name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build from Correct Root Directory
        run: |
          # Doğrudan settings dosyasını arayıp projenin gerçek kalbine iniyoruz
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle dosyası hiçbir yerde bulunamadı!"
            exit 1
          fi
          
          DIR=$(dirname "$SETTINGS_FILE")
          echo "Gerçek proje kök dizini: $DIR"
          cd "$DIR"
          
          # Eğer bu dizinde gradlew yoksa hemen oluşturalım
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
