name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Depodaki tüm dosyaları listeler ve derlemeyi en üst düzeyde zorlar
      - name: Force Build
        run: |
          echo "Repodaki tüm dosya ve klasörler:"
          find . -maxdepth 3
          
          # Eğer alt klasörde kaldıysa, build.gradle veya build.gradle.kts içeren ilk klasöre gir
          PROJECT_DIR=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          
          if [ -n "$PROJECT_DIR" ]; then
            DIR=$(dirname "$PROJECT_DIR")
            echo "Bulunan proje klasörüne giriliyor: $DIR"
            cd "$DIR"
          else
            echo "Proje dosyası bulunamadı, mevcut dizinde devam ediliyor."
          fi
          
          # Wrapper yoksa oluştur
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
