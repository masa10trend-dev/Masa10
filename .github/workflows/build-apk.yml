name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # gradlew dosyasını repoda nerede olursa olsun otomatik bulur ve çalıştırır
      - name: Find Gradlew and Build APK
        run: |
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "HATA: Repoda gradlew dosyası bulunamadı! Lütfen gradlew dosyasını GitHub'a yüklediğinizden emin olun."
            exit 1
          fi
          echo "gradlew dosyası şurada bulundu: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Üretilen APK'yı otomatik bulup artifact olarak kaydeder
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
