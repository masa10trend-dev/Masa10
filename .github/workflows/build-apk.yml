name: Masa10 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: ZIP'i aç
        run: |
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d extracted
          cp -R extracted/masa10_v10_work/. .
          echo "Masa10 projesi hazırlandı."
          ls -la
          ls -la app

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
