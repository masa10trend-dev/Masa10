name: Masa10 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Masa10 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK 37 kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;36.0.0"

      - name: Proje yapısını kontrol et
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app || true

      - name: Gradle ile APK oluştur
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Masa10-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
