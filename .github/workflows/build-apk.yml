name: Masa10 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Masa10 Debug APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. GitHub deposunu indir
      # --------------------------------------------------
      - name: GitHub deposunu al
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Android SDK kur
        uses: android-actions/setup-android@v4


      # --------------------------------------------------
      # 4. Android 37 + Build Tools
      # --------------------------------------------------
      - name: Android 37 ve Build Tools kur
        shell: bash
        run: |
          set -eux

          yes | sdkmanager --licenses || true

          echo "Android SDK paketleri kontrol ediliyor..."

          sdkmanager --list | grep -E \
            "platforms;android-37|build-tools;37|build-tools;36" \
            | head -50 || true

          if sdkmanager --list | grep -q "platforms;android-37.0"; then
            echo "Android 37.0 bulundu."
            sdkmanager "platforms;android-37.0"

          elif sdkmanager --list | grep -q "platforms;android-37"; then
            echo "Android 37 bulundu."
            sdkmanager "platforms;android-37"

          else
            echo "HATA: Android API 37 bulunamadı."
            exit 1
          fi

          if sdkmanager --list | grep -q "build-tools;37.0.0"; then
            echo "Build Tools 37.0.0 kuruluyor."
            sdkmanager "build-tools;37.0.0"

          else
            echo "Build Tools 36.0.0 kuruluyor."
            sdkmanager "build-tools;36.0.0"
          fi


      # --------------------------------------------------
      # 5. Gradle 9.6
      # --------------------------------------------------
      - name: Gradle 9.6 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'


      # --------------------------------------------------
      # 6. Masa10 ZIP dosyasını bul
      # --------------------------------------------------
      - name: Masa10 ZIP dosyasını bul
        shell: bash
        run: |
          set -eux

          ZIP_FILE=""

          if [ -f "Masa10_v10_APK_Duzeltilmis.zip" ]; then
            ZIP_FILE="Masa10_v10_APK_Duzeltilmis.zip"

          elif [ -f "Masa10_v10_Reklam_Paketleri_999_1999.zip" ]; then
            ZIP_FILE="Masa10_v10_Reklam_Paketleri_999_1999.zip"

          else
            ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Masa10 ZIP dosyası bulunamadı!"
            echo ""
            echo "Depodaki dosyalar:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "======================================"
          echo "Kullanılacak ZIP:"
          echo "$ZIP_FILE"
          echo "======================================"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 7. ZIP'i aç
      # --------------------------------------------------
      - name: Masa10 projesini ZIP'ten çıkar
        shell: bash
        run: |
          set -eux

          rm -rf masa10_project
          mkdir -p masa10_project

          unzip -q "$ZIP_FILE" -d masa10_project

          echo "ZIP içeriği:"
          find masa10_project -maxdepth 5 -type f -print

          SETTINGS_FILE=$(find masa10_project \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle.kts bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "======================================"
          echo "Masa10 proje klasörü:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 8. AGP 9 Kotlin uyumluluğu
      # --------------------------------------------------
      - name: AGP 9 Kotlin uyumluluğunu düzelt
        shell: bash
        run: |
          set -eux

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$ROOT" ]; then
            echo "HATA: Root build.gradle.kts bulunamadı."
            exit 1
          fi

          if [ ! -f "$APP" ]; then
            echo "HATA: app/build.gradle.kts bulunamadı."
            exit 1
          fi

          echo "=== ROOT BUILD ÖNCESİ ==="
          cat "$ROOT"

          echo "=== APP BUILD ÖNCESİ ==="
          cat "$APP"

          # AGP 9 built-in Kotlin kullandığı için
          # eski Kotlin Android plugin satırını kaldırıyoruz.
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$ROOT"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$APP"

          echo "=== ROOT BUILD SONRASI ==="
          cat "$ROOT"

          echo "=== APP BUILD SONRASI ==="
          cat "$APP"


      # --------------------------------------------------
      # 9. Masa10 Kotlin Billing hatalarını düzelt
      # --------------------------------------------------
      -
