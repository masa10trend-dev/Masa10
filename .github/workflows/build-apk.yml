name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Deponun içeriğini doğrudan terminale döküp görelim ve build alalım
      - name: Direct Build Process
        run: |
          echo "Mevcut dizindeki dosyalar:"
          ls -la
          
          # Eğer ana dizinde gradlew yoksa alt klasörlere bakmadan doğrudan gradle wrapper tetikle
          if [ ! -f "./gradlew" ]; then
            # Alt klasörde olma ihtimaline karşı ilk bulduğu gradle'ı çalıştırılabilir yap
            find . -name "gradlew" -exec chmod +x {} \;
            GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
            
            if [ -n "$GRADLEW_FILE" ]; then
              DIR=$(dirname "$GRADLEW_FILE")
              cd "$DIR"
              ./gradlew assembleDebug
            else
              echo "Gradlew hiç bulunamadı, sistem üzerinden derleniyor..."
              gradle wrapper
              chmod +x ./gradlew
              ./gradlew assembleDebug
            fi
          else
            chmod +x ./gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
