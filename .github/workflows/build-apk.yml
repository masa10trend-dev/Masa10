name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android manifest dosyasını bularak projenin tam yerini tespit eder ve build alır
      - name: Universal Build Script
        run: |
          MANIFEST=$(find . -name "AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "HATA: AndroidManifest.xml bulunamadı! Lütfen proje dosyalarını kontrol edin."
            exit 1
          fi
          
          # Manifest'in bulunduğu klasörden iki üst dizin projenin ana köküdür (app/src/main/...)
          # Gradle dosyasının olduğu dizine geçiyoruz
          DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          echo "Proje kök dizini tespit edildi: $DIR"
          cd "$DIR"
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
