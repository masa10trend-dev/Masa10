name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip, Fix Plugin Conflict and Build
        run: |
          # 1. Zip dosyasını aç ve proje dizinine in
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          # 2. app/build.gradle.kts içindeki çakışan Kotlin eklenti tanımını temizle/yorum satırı yap
          if [ -f "app/build.gradle.kts" ]; then
            echo "Kotlin eklenti çakışması temizleniyor..."
            sed -i '/org.jetbrains.kotlin.android/s/^/\/\//' app/build.gradle.kts
            sed -i '/kotlin("android")/s/^/\/\//' app/build.gradle.kts
          fi
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          
          # 3. Derlemeyi başlat
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
