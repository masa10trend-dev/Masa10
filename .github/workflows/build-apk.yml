name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Direct Build Process with Stacktrace
        run: |
          # Gradlew dosyasını bul ve çalıştır, hata detayını göster (--stacktrace)
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
          
          if [ -n "$GRADLEW_FILE" ]; then
            DIR=$(dirname "$GRADLEW_FILE")
            echo "Çalıştırılan dizin: $DIR"
            cd "$DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradlew bulunamadı, yeniden oluşturuluyor..."
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
