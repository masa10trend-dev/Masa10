name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip, Fix Built-in Kotlin and Build
        run: |
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          # AGP built-in Kotlin uyumsuzluğunu çözmek için sürüm tanımlıyoruz
          echo "android.kotlin.version=1.9.24" >> gradle.properties
          
          # Çakışmaya neden olan manuel Kotlin eklenti satırlarını siliyoruz
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/org.jetbrains.kotlin.android/d' app/build.gradle.kts
            sed -i '/kotlin("android")/d' app/build.gradle.kts
          fi
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
