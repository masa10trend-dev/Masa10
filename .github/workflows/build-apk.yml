name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build with Error Dump
        run: |
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          
          # Hata durumunda log dosyasını ekrana yazdırıp çıkış yapacağız
          ./gradlew assembleDebug --stacktrace || {
            echo "=== GRADLE HATA DETAYLARI ==="
            if [ -f "app/build/reports/problems/problems-report.html" ]; then
              cat app/build/reports/problems/problems-report.html
            fi
            exit 1
          }
