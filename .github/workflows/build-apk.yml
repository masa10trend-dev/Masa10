name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Proje klasörünü otomatik bulur, gradlew yoksa kurar ve Debug APK üretir
      - name: Locate Project and Build APK
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          fi
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: Proje yapılandırma dosyası bulunamadı!"
            exit 1
          fi
          
          DIR=$(dirname "$SETTINGS_FILE")
          echo "Proje dizini: $DIR"
          cd "$DIR"
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Üretilen APK dosyasını bulup indirmeye hazır hale getirir
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa10-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
