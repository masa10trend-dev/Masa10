name: Masa10 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Masa10 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android 37 ve Build Tools kur
        shell: bash
        run: |
          set -eux

          yes | sdkmanager --licenses || true

          echo "Android SDK paketleri:"
          sdkmanager --list | grep -E "platforms;android-37|build-tools;37|build-tools;36" | head -50 || true

          if sdkmanager --list | grep -q "platforms;android-37.0"; then
            echo "Android 37.0 bulundu."
            sdkmanager "platforms;android-37.0"
          elif sdkmanager --list | grep -q "platforms;android-37"; then
            echo "Android 37 bulundu."
            sdkmanager "platforms;android-37"
          else
            echo "HATA: Android API 37 bulunamadı."
            exit 1
          fi

          if sdkmanager --list | grep -q "build-tools;37.0.0"; then
            sdkmanager "build-tools;37.0.0"
          else
            sdkmanager "build-tools;36.0.0"
          fi

      - name: Gradle 9.6 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Masa10 ZIP dosyasını bul
        shell: bash
        run: |
          set -eux

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            \
              -name "Masa10_v10_APK_Duzeltilmis.zip" \
              -o \
              -name "Masa10_v10_Reklam_Paketleri_999_1999.zip" \
            \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Masa10 ZIP dosyası bulunamadı!"
            echo "Depodaki ZIP dosyaları:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Kullanılacak ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Masa10 projesini ZIP'ten çıkar
        shell: bash
        run: |
          set -eux

          rm -rf masa10_project
          mkdir -p masa10_project

          unzip -q "$ZIP_FILE" -d masa10_project

          SETTINGS_FILE=$(find masa10_project \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle.kts bulunamadı!"
            find masa10_project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Masa10 proje klasörü:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: AGP 9 Kotlin uyumluluğunu düzelt
        shell: bash
        run: |
          set -eux

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          echo "=== ROOT BUILD ==="
          cat "$ROOT"

          echo "=== APP BUILD ==="
          cat "$APP"

          # AGP 9 kendi Kotlin entegrasyonunu kullandığı için
          # eski Kotlin Android plugin satırlarını kaldır.
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$ROOT"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$APP"

          echo "=== DÜZELTİLMİŞ ROOT BUILD ==="
          cat "$ROOT"

          echo "=== DÜZELTİLMİŞ APP BUILD ==="
          cat "$APP"

      - name: Masa10 Kotlin kaynaklarını otomatik düzelt
        shell: bash
        run: |
          set -eux

          MAIN="$PROJECT_DIR/app/src
