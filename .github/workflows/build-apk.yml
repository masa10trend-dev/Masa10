name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Apply Plugin Fix
        run: |
          unzip -q Masa10_v10_Reklam_Paketleri_999_1999.zip -d unzipped_project
          cd unzipped_project
          
          TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            DIR=$(dirname "$TARGET_FILE")
            cd "$DIR"
          fi
          
          # Kotlin versiyon çakışmasını önlemek için root build.gradle.kts dosyasına Kotlin plugin versiyonunu sabitliyoruz
          if [ -f "build.gradle.kts" ]; then
            echo "Root build.gradle.kts güncelleniyor..."
            sed -i 's/plugins {/plugins {kotlin("android") version "1.9.24" apply false/g' build.gradle.kts || true
          fi
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
