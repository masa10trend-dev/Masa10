      - name: Masa10 ZIP dosyasını bul
        shell: bash
        run: |
          set -eux

          ZIP_FILE=""

          if [ -f "Masa10_v10_APK_Duzeltilmis.zip" ]; then
            ZIP_FILE="Masa10_v10_APK_Duzeltilmis.zip"
          elif [ -f "Masa10_v10_Reklam_Paketleri_999_1999.zip" ]; then
            ZIP_FILE="Masa10_v10_Reklam_Paketleri_999_1999.zip"
          else
            ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Masa10 ZIP dosyası bulunamadı!"
            echo "Depodaki dosyalar:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Kullanılacak ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
